services:
  - type: web
    name: battlab-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: DATABASE_URL
        value: sqlite:///./battlab.db
      - key: ALLOWED_ORIGINS
        value: "*"
